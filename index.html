<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noah Deetz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fafafa;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .container {
      animation: fadeIn 0.8s ease;
    }
    h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 12px;
    }
    .subtitle {
      font-size: clamp(0.95rem, 2vw, 1.15rem);
      color: #555;
      font-weight: 400;
      margin-bottom: 48px;
    }
    .coming-soon {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 32px;
    }
    .links {
      display: flex;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;
    }
    .links a {
      font-size: 0.9rem;
      font-weight: 500;
      color: #555;
      text-decoration: none;
      transition: color 0.2s;
    }
    .links a:hover { color: #1a1a1a; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Noah Deetz</h1>
    <p class="subtitle">Plugin Designer · Audio Developer</p>
    <p class="coming-soon">Portfolio coming soon</p>
    <div class="links">
      <a href="https://www.linkedin.com/in/noah-deetz/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="https://fineclassicsplugins.com" target="_blank" rel="noopener noreferrer">Fine Classics Plugins</a>
      <a href="mailto:deetznoah@gmail.com">Email</a>
    </div>
  </div>
</body>
</html>
